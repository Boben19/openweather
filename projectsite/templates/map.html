<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
   <a href="{% url 'weather' %}" style="position:absolute; top:10px; right:10px; z-index:1000; padding:8px 16px; background:white; border-radius:6px; text-decoration:none; color:#111; box-shadow:0 1px 4px rgba(0,0,0,.3);">← Back to Dashboard</a>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([12.8, 122], 5);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  referrerPolicy: "origin",
  attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

    map.on("click", async (e) => {
      const { lat, lng } = e.latlng.wrap();
      const popup = L.popup().setLatLng(e.latlng).setContent("Loading...").openOn(map);

      try {
        const res = await fetch(`/api/weather/?lat=${lat}&lon=${lng}`);
        const data = await res.json();

        if (data.error) {
  popup.setContent(`${data.error}<br><small>${data.details || ""}</small>`);
  return;
}

        popup.setContent(`
          <strong>${data.city}, ${data.country}</strong><br>
          <img src="https://openweathermap.org/img/wn/${data.icon}@2x.png" width="60"><br>
          ${data.temp} °C<br>
          ${data.description}
        `);
      } catch (err) {
        popup.setContent("Could not load weather.");
      }
    });
  </script>
</body>
</html>
